name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - run: python scripts/check_review.py examples/quick-gate-review.json
      - run: python scripts/check_review.py examples/standard-gate-review.json
      - run: python scripts/check_review.py examples/ux3-council-review.json
      - run: python scripts/check_review.py examples/live-coding-review.json
      - run: python scripts/check_review.py examples/stop-reframe-review.json
      - run: python scripts/check_override.py examples/verdict-override.json examples/stop-reframe-review.json

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install the complete local skill bundle
        run: |
          skill_home="$RUNNER_TEMP/skill-install-home"
          mkdir -p "$skill_home"
          HOME="$skill_home" npx -y skills add . -g -a universal -y --copy
          bundle="$skill_home/.agents/skills/product-design-harness"
          test -f "$bundle/SKILL.md"
          test -f "$bundle/resources/schemas/review-result.schema.json"
          test -f "$bundle/resources/scripts/check_review.py"
      - name: Validate an installed golden review
        run: |
          bundle="$RUNNER_TEMP/skill-install-home/.agents/skills/product-design-harness"
          python -m pip install -r "$bundle/resources/requirements-dev.txt"
          python "$bundle/resources/scripts/check_review.py" \
            "$bundle/resources/examples/quick-gate-review.json"
      - name: Package the validated skill
        working-directory: skills/product-design-harness
        run: zip -qr "$RUNNER_TEMP/product-design-harness.zip" SKILL.md LICENSE resources -x '*/__pycache__/*' '*.pyc'
      - name: Upload the marketplace submission bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-design-harness-marketplace
          path: ${{ runner.temp }}/product-design-harness.zip
          if-no-files-found: error
